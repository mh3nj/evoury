[package]
name = "evoury"
version = "0.1.0"
description = "Evoury - Offline-first Creative Asset Manager"
authors = ["you"]
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["dialog-open", "shell-open", "protocol-asset", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"

atlas-core = { path = "../crates/atlas-core" }
atlas-events = { path = "../crates/atlas-events" }
atlas-library = { path = "../crates/atlas-library" }
atlas-scanner = { path = "../crates/atlas-scanner" }
atlas-metadata = { path = "../crates/atlas-metadata" }
atlas-search = { path = "../crates/atlas-search" }
atlas-preview = { path = "../crates/atlas-preview" }
atlas-health = { path = "../crates/atlas-health" }
atlas-duplicate = { path = "../crates/atlas-duplicate" }
atlas-basket = { path = "../crates/atlas-basket" }
atlas-links = { path = "../crates/atlas-links" }
atlas-preferences = { path = "../crates/atlas-preferences" }
atlas-power = { path = "../crates/atlas-power" }
atlas-collection = { path = "../crates/atlas-collection" }
atlas-indexer = { path = "../crates/atlas-indexer" }
atlas-cache = { path = "../crates/atlas-cache" }
atlas-command = { path = "../crates/atlas-command" }
atlas-workspace = { path = "../crates/atlas-workspace" }
atlas-import = { path = "../crates/atlas-import" }
atlas-registry = { path = "../crates/atlas-registry" }
atlas-scheduler = { path = "../crates/atlas-scheduler" }
atlas-worker = { path = "../crates/atlas-worker" }
atlas-haystack = { path = "../crates/atlas-haystack" }
atlas-layout = { path = "../crates/atlas-layout" }
atlas-workstation = { path = "../crates/atlas-workstation" }
atlas-profiles = { path = "../crates/atlas-profiles" }
atlas-selection = { path = "../crates/atlas-selection" }
atlas-navigation = { path = "../crates/atlas-navigation" }
atlas-keyboard = { path = "../crates/atlas-keyboard" }
atlas-animation = { path = "../crates/atlas-animation" }
atlas-viewer = { path = "../crates/atlas-viewer" }
atlas-compare = { path = "../crates/atlas-compare" }
atlas-gpu = { path = "../crates/atlas-gpu" }
atlas-color = { path = "../crates/atlas-color" }
atlas-history = { path = "../crates/atlas-history" }
atlas-project = { path = "../crates/atlas-project" }
atlas-undo = { path = "../crates/atlas-undo" }
atlas-batch = { path = "../crates/atlas-batch" }
atlas-pipeline = { path = "../crates/atlas-pipeline" }
atlas-macro = { path = "../crates/atlas-macro" }
atlas-notification = { path = "../crates/atlas-notification" }
atlas-backup = { path = "../crates/atlas-backup" }
atlas-db = { path = "../crates/atlas-db" }
atlas-plugin = { path = "../crates/atlas-plugin" }
atlas-diagnostics = { path = "../crates/atlas-diagnostics" }
rusqlite = { version = "0.31", features = ["bundled"] }
