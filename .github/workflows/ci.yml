name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Linux system dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.0-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    # The toolchain is pinned so every platform compiles with the same rustc
    # and clippy, the same way the release installers are built.
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.96.0

    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Rust tests
      run: cargo test --workspace

    - name: Run frontend tests
      run: pnpm test

  lint:
    name: Lint
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Linux system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.0-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Run Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Check TypeScript formatting
      run: pnpm format:check

    - name: Run ESLint
      run: pnpm lint

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Linux system dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.0-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.96.0

    - name: Cache Rust dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-
          ${{ runner.os }}-cargo-

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Tauri app
      run: pnpm tauri build
