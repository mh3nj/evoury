[package]
name = "atlas-cache"
version = "0.1.0"
edition = "2021"

[dependencies]
atlas-core = { path = "../atlas-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
